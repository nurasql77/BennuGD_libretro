name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Защищённые строки (ссылки) ----------
      - name: Generate protected strings
        run: python3 tools/gen_strings.py

      # ---------- 2. Ядро (.so), только ARM64 ----------
      - name: Build core (arm64-v8a)
        run: |
          cmake -B build-core \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=24 \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_WARN_DEPRECATED=false \
            -DCMAKE_PROJECT_INCLUDE="${GITHUB_WORKSPACE}/sorr/sorr_inject.cmake" \
            -S .
          cmake --build build-core

      - name: Put core into the app
        run: |
          SO=$(find build-core -maxdepth 2 -name 'bennugd_libretro*.so' | head -n 1)
          if [ -z "$SO" ]; then
            echo "::error::bennugd_libretro .so not found in build-core/"
            ls -R build-core | head -n 80
            exit 1
          fi
          DEST=app/src/main/jniLibs/arm64-v8a/libbennugd_libretro.so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SO" "$DEST"
          LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM_BIN/llvm-strip" --strip-unneeded "$DEST"
          rm -f app/src/main/assets/bennugd_libretro.so
          file "$DEST"
          ls -l app/src/main/jniLibs/arm64-v8a

          # Проверяем, что защита попала в ядро и ссылка не лежит открытым текстом
          if "$LLVM_BIN/llvm-nm" -D --defined-only "$DEST" | grep -q "Java_com_nurasql77_sorr_Native_link"; then
            echo "Guard exported: OK"
          else
            echo "::warning::Защита не попала в ядро (нет функции Native_link). Telegram-кнопка и проверка подписи работать не будут. Пришлите CMakeLists.txt."
          fi
          if grep -q "t.me/android_port" "$DEST"; then
            echo "::error::Ссылка найдена в .so открытым текстом"
            exit 1
          fi

      # ---------- 3. Подпись ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is empty"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Detect key alias and certificate hash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ALIAS=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep PrivateKeyEntry | head -n 1 | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "::error::No private key found in keystore (wrong password or file?)"
            exit 1
          fi
          CERT_SHA256=$(keytool -exportcert -alias "$ALIAS" -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1)
          echo "Key alias: $ALIAS"
          echo "Certificate SHA-256: $CERT_SHA256"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Patch signature guard into the core
        run: |
          python3 tools/patch_guard.py app/src/main/jniLibs/arm64-v8a/libbennugd_libretro.so "$CERT_SHA256"

      # ---------- 4. APK ----------
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: >
          gradle assembleRelease --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=${APP_VERSION}

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SoRR-Android-v${APP_VERSION}.apk"
          ls -l SoRR-Android-v${APP_VERSION}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoRR-release-apk
          path: SoRR-Android-v*.apk

      # ---------- 5. Релиз на GitHub ----------
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${APP_VERSION}" "SoRR-Android-v${APP_VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "SoRR Android v${APP_VERSION}" \
            --notes "Подписанный APK. Скачайте файл SoRR-Android-v${APP_VERSION}.apk и установите. Нужна папка SoRR с файлом SorR.dat."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
