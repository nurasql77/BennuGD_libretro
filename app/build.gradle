plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nurasql77.sorr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nurasql77.sorr'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Core тек ARM64 үшін жиналған
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            // .so файлдар nativeLibraryDir ішіне шығарылсын (core-дың нақты жолы болуы үшін)
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.github.swordfish90:libretrodroid:0.13.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
}
