plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def ciVersionName = (project.findProperty('versionName') ?: '1.0').toString()

android {
    namespace 'com.nurasql77.sorr'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.base64E.port'
        minSdk 24
        targetSdk 34
        // CI передаёт -PversionCode=N -PversionName=1.0.N
        versionCode ciVersionCode
        versionName ciVersionName

        // Core тек ARM64 үшін жиналған
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Қол қою: GitHub Actions ортасынан оқылады (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
    signingConfigs {
        release {
            def ksFile = System.getenv('KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            // .so файлдар nativeLibraryDir ішіне шығарылсын (core-дың нақты жолы болуы үшін)
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.github.swordfish90:libretrodroid:0.13.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    // Сенсорлық басқару (Lemuroid-та қолданылатын кітапхана, JitPack арқылы)
    implementation 'com.github.swordfish90:radialgamepad:2.0.0'
}
